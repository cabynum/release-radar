id: fix-version-at-planning-freeze
name: Fix Version Required at Planning Freeze
description: 'By Planning Freeze, all Features with Target Version for the
  upcoming release must have Fix Version applied to indicate engineering commitment.

  '
applies_to:
- Feature
trigger:
  milestone: planning_freeze
  days_before: 3
condition:
  field_set: target_version
  target_version_matches_release: true
  field_empty: fix_version
action:
  type: alert
  message: 'Feature {key} has Target Version {target_version} but no Fix Version
    with {days} days until Planning Freeze ({milestone_date}). Fix Version
    indicates engineering commitment and is required.

    '
  recipients:
  - assignee
  - manager
release_phase: pre-planning-freeze
scope: org
verification: deterministic
enforcement: alert
sources:
- id: SOURCE-144
  excerpt: By Planning Freeze all Fix Versions must be applied to indicate
    engineering commitment
- id: SOURCE-21
  excerpt: Fix Version must be set at commit time, not after work is done
date_added: 2026-07-28

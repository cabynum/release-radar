id: post-code-freeze-exception
name: Post-Code-Freeze Exception Process
description: 'After Code Freeze, changes that keep work in an active delivery
  status must go through the blocker exception process. Release Blocker must
  be Approved. Completing work by moving to Release Pending or Closed is not
  itself a blocker-exception event (that is the desired end state). Distinct
  from Release Scope / Release Commit Exception (Feature Freeze).

  '
applies_to:
- Feature
- Epic
- Story
- Task
- Bug
trigger:
  milestone: code_freeze
  days_after: 0
condition:
  field_set: fix_version
  fix_version_matches_release: true
  status_changed_after: code_freeze_date
  status_not:
  - Release Pending
  - Closed
  field_not_value:
    field: release_blocker
    value: Approved
action:
  type: alert
  message: 'Feature {key} was modified after Code Freeze without Release
    Blocker = Approved. Follow the exception process: set Release Blocker
    to Proposed, populate Affected Version + Fix Version, add risk
    assessment in comments.

    '
  recipients:
  - assignee
  - manager
release_phase: post-code-freeze
scope: org
verification: deterministic
enforcement: alert
sources:
- id: SOURCE-85
  excerpt: 'Code Freeze Blocker Exception Process: set Release Blocker to
    Proposed, populate Affected/Fix Version, complete risk assessment; 1-biz-day
    turnaround'
- id: SOURCE-145
  excerpt: Follow the post-code freeze exception process for any changes to
    release branch
date_added: 2026-07-28

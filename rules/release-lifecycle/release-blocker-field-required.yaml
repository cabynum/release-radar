id: release-blocker-field-required
name: Release Blocker Field Required for Post-Freeze Changes
description: 'Any issue still in active delivery status after Code Freeze,
  with Fix Version matching the release and a post-freeze status change,
  must have Release Blocker set (Proposed or Approved). Empty Release
  Blocker after freeze = process violation. Does not apply once the issue
  is Release Pending or Closed.

  '
applies_to:
- Feature
- Epic
- Story
- Task
- Bug
trigger:
  milestone: code_freeze
  days_after: 0
condition:
  field_set: fix_version
  fix_version_matches_release: true
  status_changed_after: code_freeze_date
  status_not:
  - Release Pending
  - Closed
  field_empty: release_blocker
action:
  type: alert
  message: 'Feature {key} was modified after Code Freeze without Release
    Blocker field set. Must be Proposed (awaiting review) or Approved
    (exception granted). Populate Affected Version + Fix Version and add
    risk assessment.

    '
  recipients:
  - assignee
  - manager
release_phase: post-code-freeze
scope: org
verification: deterministic
enforcement: alert
sources:
- id: SOURCE-85
  excerpt: Set Release Blocker field to Proposed, populate Affected/Fix Version,
    complete risk assessment
- id: SOURCE-145
  excerpt: Release Blocker field was not populated, suggesting the process
    was not followed consistently
date_added: 2026-07-28

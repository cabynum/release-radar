id: strat-review-required
name: Strat-Review Approval Required Before Planning Freeze
status: suppressed
enabled: false
description: 'SUPPRESSED 2026-08-06. Cited SOURCE-102 for a
  strat-review-approved label requirement. Live SOURCE-102 (Confluence,
  checked 2026-08-06) does not mention strat-review or that label. Planning
  guidance uses DoR/DoD language instead. Re-enable only after a real source
  defines the label or signal.

  '
applies_to:
- Feature
trigger:
  milestone: planning_freeze
  days_before: 7
condition:
  field_set: target_version
  target_version_matches_release: true
  label_missing: strat-review-approved
action:
  type: alert
  message: 'Feature {key} targets {target_version} but lacks strat-review
    approval with {days} days until Planning Freeze ({milestone_date}).

    '
  recipients:
  - assignee
  - product_manager
release_phase: pre-planning-freeze
scope: org
verification: heuristic
enforcement: alert
sources:
- id: SOURCE-102
  excerpt: 'NOT IN LIVE PAGE: "passed strat-review with approved status" is
    not present in current SOURCE-102. Invented label strat-review-approved.'
date_added: 2026-07-28
date_suppressed: 2026-08-06

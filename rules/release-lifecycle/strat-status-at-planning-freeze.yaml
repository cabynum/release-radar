id: strat-status-at-planning-freeze
name: STRAT Status Must Be At Least To Do by Planning Freeze
status: suppressed
enabled: false
description: 'SUPPRESSED 2026-08-06. Only cites unregistered SOURCE-SLACK
  (kitam, 2026-07-29). Live SOURCE-102 has no such status bar. Condition
  uses unknown operator status_in, so the engine always skipped this rule
  anyway. Re-enable only after registering the Slack source and fixing the
  condition to use a supported operator (e.g. status:).

  '
applies_to:
- Feature
trigger:
  milestone: planning_freeze
  days_before: 3
condition:
  field_set: fix_version
  fix_version_matches_release: true
  status_in:
  - New
  - Backlog
  - Refinement
action:
  type: alert
  message: 'Feature {key} has Fix Version {fix_version} but status is still
    "{status}" with {days} days until Planning Freeze ({milestone_date}).
    STRAT status must be at least To Do or In Progress to confirm readiness
    for committed scope.

    '
  recipients:
  - assignee
  - manager
release_phase: pre-planning-freeze
scope: org
verification: deterministic
enforcement: alert
sources:
- id: SOURCE-SLACK
  excerpt: 'UNREGISTERED: STRAT status also has to be at least in To Do or In
    Progress (kitam, Planning Freeze guidance, 2026-07-29). Not in live
    SOURCE-102.'
date_added: 2026-07-29
date_suppressed: 2026-08-06

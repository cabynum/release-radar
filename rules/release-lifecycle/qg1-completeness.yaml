id: qg1-completeness
name: Quality Gate 1 Completeness
description: >
  Features must pass QG1 by the PM Planning Checkpoint (typically 7 days
  before Planning Freeze). Missing fields or labels means exclusion from
  GA scope.

applies_to: [Feature]

trigger:
  milestone: planning_freeze
  days_before: 7

condition:
  field_set: target_version
  target_version_matches_release: true
  any_missing:
    - label: strat-creator-human-sign-off
    - label: rp-qg1-pass
    - field: product_manager
    - field: assignee
    - field: release_type
    - field: target_version
    - field: products
    - field: component

action:
  type: alert
  message: >
    Feature {key} is missing QG1 requirements with {days} days until
    Planning Freeze ({milestone_date}). Missing: {missing_items}.
    Features failing QG1 will be excluded from GA scope.
  recipients: [assignee, manager, product_manager]

release_phase: pre-planning-freeze
scope: org
verification: deterministic
enforcement: alert
severity: critical

sources:
  - id: SOURCE-144
    excerpt: "All Features must pass Quality Gate 1 by the PM Planning Checkpoint. Features that miss will not progress into GA scope."
  - id: SOURCE-102
    excerpt: "All features must have passed strat-review with approved status"

date_added: 2026-07-28

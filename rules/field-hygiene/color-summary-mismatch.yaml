id: color-summary-mismatch
name: Color Status / Status Summary Mismatch
status: suppressed
enabled: false
description: 'SUPPRESSED 2026-09-17. Engine policy: only rules with a documented process consequence (release exclusion, freeze gate, exception process, or mandatory field for that issue type/status) stay active. This rule fails that bar. Re-enable only if a source elevates it to a hard requirement.

Original intent: Red Color Status must have a non-empty Status Summary.

'
applies_to:
- Feature
- Epic
condition:
  color_status: Red
  field_empty: status_summary
action:
  type: alert
  message: '{key} has Color Status = Red but Status Summary is empty. Add a
    summary so stakeholders know what is blocked and why.

    '
  recipients:
  - assignee
scope: org
verification: deterministic
enforcement: comment
sources:
- id: SOURCE-12
  excerpt: Color Status is Red but Status Summary is empty
date_added: 2026-07-28
date_narrowed: 2026-08-06
date_suppressed: 2026-09-17

id: color-summary-mismatch
name: Color Status / Status Summary Mismatch
description: 'When Color Status is Red, Status Summary must not be empty
  (SOURCE-12). Color-word prefix matching (summary must start with GREEN /
  YELLOW / RED) was dropped 2026-08-06 as board convention, not
  source-backed policy.

  '
applies_to:
- Feature
- Epic
condition:
  color_status: Red
  field_empty: status_summary
action:
  type: alert
  message: '{key} has Color Status = Red but Status Summary is empty. Add a
    summary so stakeholders know what is blocked and why.

    '
  recipients:
  - assignee
scope: org
verification: deterministic
enforcement: comment
sources:
- id: SOURCE-12
  excerpt: Color Status is Red but Status Summary is empty
date_added: 2026-07-28
date_narrowed: 2026-08-06

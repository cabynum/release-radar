id: likely-closeable
name: Feature Appears Closeable
description: >
  Feature has been in Release Pending with all child work complete
  and documentation resolved. It likely should be moved to Closed.
applies_to:
- Feature
condition:
  status:
  - Release Pending
  all_children_complete: true
  docs_resolved: true
  days_in_status: 5
action:
  type: alert
  message: >
    {key} has been in Release Pending for {days_in_status}d with all
    child Epics/Stories complete and docs resolved. Consider closing.
  recipients:
  - assignee
scope: org
verification: heuristic
enforcement: alert
sources:
- id: SOURCE-user
  excerpt: Features with all children done should not sit in Release Pending indefinitely
date_added: 2026-08-21

id: missing-git-pr
name: Missing Git Pull Request Field
status: suppressed
enabled: false
description: 'SUPPRESSED 2026-08-06. SOURCE-85 checks native GitHub
  integration and the Web Links field. SOURCE-03 covers git URLs in the
  wrong location (comments/description). This rule required the Git Pull
  Request custom field to be populated whenever status is Review/Testing,
  inventing a mandatory-presence check on the wrong field. Re-enable only
  with a wrong-location detector or a real Git Pull Request field mandate.

  '
applies_to:
- Story
- Task
- Bug
- CVE
condition:
  status:
  - Review
  - Testing
  field_empty: git_pull_request
action:
  type: alert
  message: '{key} is in {status} with no Git Pull Request field. Move PR links
    from comments to the dedicated field. Automation gate checks this.

    '
  recipients:
  - assignee
scope: org
verification: deterministic
enforcement: comment
sources:
- id: SOURCE-85
  excerpt: 'MISATTRIBUTED: gate checks native GitHub integration and Web
    Links field, not mandatory Git Pull Request custom field presence.'
- id: SOURCE-03
  excerpt: Git link appears in comments instead of dedicated Git Pull Request
    field (wrong-location, not empty-field)
date_added: 2026-07-28
date_suppressed: 2026-08-06

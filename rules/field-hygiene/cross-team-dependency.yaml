id: cross-team-dependency
name: Cross-Team Dependency in Bad State
status: suppressed
enabled: false
description: 'SUPPRESSED 2026-09-17. Engine policy: only rules with a documented process consequence (release exclusion, freeze gate, exception process, or mandatory field for that issue type/status) stay active. This rule fails that bar. Re-enable only if a source elevates it to a hard requirement.

Original intent: Surface blockers owned by other teams that are New/Backlog/unassigned.

'
applies_to:
- Feature
- Epic
- Story
- Task
condition:
  has_outward_link: is blocked by
  linked_issue:
    status_category_not: Done
    any_of:
    - status:
      - New
      - Backlog
    - field_empty: assignee
action:
  type: alert
  message: '{key} is blocked by {linked_key} which is in {linked_status} {linked_assignee_note}.
    Cross-team dependency at risk.

    '
  recipients:
  - assignee
  - manager
scope: org
verification: deterministic
enforcement: flag
sources:
- id: SOURCE-05
  excerpt: Jira agent config checks linked issues in other teams for bad state
- id: SOURCE-12
  excerpt: Cross-field validations include dependency state checks
date_added: 2026-07-28
date_suppressed: 2026-09-17

id: premature-target-version
name: Premature Release Target
status: suppressed
enabled: false
description: 'SUPPRESSED 2026-09-17. Engine policy: only rules with a documented process consequence (release exclusion, freeze gate, exception process, or mandatory field for that issue type/status) stay active. This rule is advisory / team-scoped hygiene with no such consequence. Re-enable only if a source elevates it to a hard requirement.

Original intent: Target Version should wait until refinement confirms scope.

'
applies_to:
- Feature
- Epic
- Story
- Task
- Bug
excludes:
- Initiative
condition:
  status:
  - New
  field_set: target_version
action:
  type: alert
  message: '{key} is in New with Target Version = {target_version}. Target
    Version should only be set after refinement confirms scope.

    '
  recipients:
  - assignee
scope: team
verification: deterministic
enforcement: flag
sources:
- id: SOURCE-01
  excerpt: Issue is in New status with a Target Version already set
- id: SOURCE-02
  excerpt: Initiatives with TV in New is acceptable for visibility
date_added: 2026-07-28
date_suppressed: 2026-09-17

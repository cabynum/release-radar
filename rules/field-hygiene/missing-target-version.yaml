id: missing-target-version
name: Missing Target Version on Feature
description: >
  Features in active status must have Target Version set. Target Version
  is the PM's desired release and is required for release planning
  visibility.

applies_to: [Feature]

condition:
  status: [Refinement, In Progress, Review]
  field_empty: target_version

action:
  type: alert
  message: >
    Feature {key} is in {status} with no Target Version. PM must set
    Target Version to indicate desired release.
  recipients: [assignee, product_manager]

scope: org
verification: deterministic
enforcement: comment
severity: high

sources:
  - id: SOURCE-21
    excerpt: "Target Version = PM request. Fix Version = delivery commitment."
  - id: SOURCE-14
    excerpt: "Target Version set by Product Managers. Represents a desired release."

date_added: 2026-07-28

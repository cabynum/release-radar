id: missing-signoff-template
name: Feature Signoff Template Missing
status: suppressed
enabled: false
description: 'SUPPRESSED 2026-09-17. SOURCE-149 (Feb 2026) asked Delivery Owners to manually clone DP/TP/GA signoff templates. ADLC/strat-creator does not attach these templates; DP Features with Release Type never have the links. Manual clone hygiene is outdated relative to the AI Feature pipeline. Re-enable only if a current org process re-mandates template cloning (or ADLC automates it).

Original intent: Delivery Owners clone DP/TP/GA signoff templates (SOURCE-149) when creating Features.

'
applies_to:
- Feature
condition:
  field_set: release_type
  status:
  - In Progress
  - Review
  no_linked_signoff_template: true
action:
  type: alert
  message: 'Feature {key} has Release Type = {release_type} but no linked
    signoff template. Add the appropriate template: Dev Preview (RHOAIENG-31244),
    Tech Preview (RHOAIENG-31290), or GA (RHOAIENG-31303).

    '
  recipients:
  - assignee
scope: org
verification: heuristic
enforcement: comment
sources:
- id: SOURCE-149
  excerpt: Delivery Owners must include the appropriate Jira template immediately
    when creating the feature
date_added: 2026-07-28
date_suppressed: 2026-09-17

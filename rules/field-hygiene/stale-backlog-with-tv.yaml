id: stale-backlog-with-tv
name: Stale Backlog with Target Version
status: suppressed
enabled: false
description: 'SUPPRESSED 2026-09-17. Engine policy: only rules with a documented process consequence (release exclusion, freeze gate, exception process, or mandatory field for that issue type/status) stay active. This rule is advisory / team-scoped hygiene with no such consequence. Re-enable only if a source elevates it to a hard requirement.

Original intent: Stale New/Backlog Features with Target Version are false commitments.

'
applies_to:
- Feature
condition:
  status:
  - New
  - Backlog
  days_in_status: 60
  field_set: target_version
action:
  type: alert
  message: 'Feature {key} has been in {status} for {days} days with Target
    Version = {target_version}. Start refinement, remove TV, or push to later
    release.

    '
  recipients:
  - assignee
  - product_manager
scope: team
verification: deterministic
enforcement: flag
sources:
- id: SOURCE-12
  excerpt: Feature in New/Backlog for more than 60 days with Target Version
    set
date_added: 2026-07-28
date_suppressed: 2026-09-17

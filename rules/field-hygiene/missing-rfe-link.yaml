id: missing-rfe-link
name: Missing RFE Link on Feature
status: suppressed
enabled: false
description: 'SUPPRESSED 2026-09-17. Engine policy: only rules with a documented process consequence (release exclusion, freeze gate, exception process, or mandatory field for that issue type/status) stay active. This rule is advisory / team-scoped hygiene with no such consequence. Re-enable only if a source elevates it to a hard requirement.

Original intent: Features should link to an approved RHAIRFE for intake provenance.

'
applies_to:
- Feature
condition:
  status:
  - Refinement
  - In Progress
  - Review
  no_clones_link_to: RHAIRFE-*
action:
  type: alert
  message: 'Feature {key} has no "clones" link to an approved RHAIRFE issue.
    Was this feature vetted through RFE Council?

    '
  recipients:
  - assignee
scope: team
verification: deterministic
enforcement: flag
sources:
- id: SOURCE-01
  excerpt: Feature is in active status and is not linked via 'clones' link
    to an approved RHAIRFE issue
date_added: 2026-07-28
date_suppressed: 2026-09-17

id: missing-issue-links
name: Missing Issue Links on Feature
status: suppressed
enabled: false
description: 'SUPPRESSED 2026-08-06. SOURCE-04 requires Issue Links when a
  Feature is blocked by, dependent on, or related to another issue. The rule
  fired on any empty Issue Links field (unconditional), inventing a "every
  Feature must have links" mandate. Re-enable only with a condition that
  detects an actual dependency signal. Message previously hedged ("If there
  are…") but the condition did not.

  Original intent: Features with dependencies should capture them in Issue
  Links.

  '
applies_to:
- Feature
condition:
  status:
  - In Progress
  - Review
  field_empty: issue_links
action:
  type: alert
  message: 'Feature {key} has no Issue Links. If there are dependencies or
    blockers, capture them in the Issue Links field.

    '
  recipients:
  - assignee
scope: team
verification: heuristic
enforcement: flag
sources:
- id: SOURCE-04
  excerpt: 'WEAK / OVERREACH: SOURCE-04 requires Issue Links when
    blocked/dependent/related. Unconditional empty-field check invented a
    broader mandate.'
date_added: 2026-07-28
date_suppressed: 2026-08-06

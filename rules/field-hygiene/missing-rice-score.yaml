id: missing-rice-score
name: Missing RICE Score on Feature
status: suppressed
enabled: false
description: 'SUPPRESSED 2026-09-17. Engine policy: only rules with a documented process consequence (release exclusion, freeze gate, exception process, or mandatory field for that issue type/status) stay active. This rule is advisory / team-scoped hygiene with no such consequence. Re-enable only if a source elevates it to a hard requirement.

Original intent: RICE scoring for prioritization past Refinement.

'
applies_to:
- Feature
condition:
  status:
  - Refinement
  - In Progress
  - Review
  field_empty: rice_score
  not_grandfathered: true
action:
  type: alert
  message: 'Feature {key} has incomplete RICE score. Complete all four fields:
    Reach, Impact, Confidence, Effort.

    '
  recipients:
  - assignee
  - product_manager
scope: team
verification: deterministic
enforcement: flag
sources:

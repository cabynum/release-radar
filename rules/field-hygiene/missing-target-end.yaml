id: missing-target-end
name: Missing Target End on Feature
status: suppressed
enabled: false
description: 'SUPPRESSED 2026-09-17. Engine policy: only rules with a documented process consequence (release exclusion, freeze gate, exception process, or mandatory field for that issue type/status) stay active. This rule is advisory / team-scoped hygiene with no such consequence. Re-enable only if a source elevates it to a hard requirement.

Original intent: Target End as PM need-by date for timeline reporting.

'
applies_to:
- Feature
condition:
  status:
  - Refinement
  - In Progress
  - Review
  field_empty: target_end
action:
  type: alert
  message: 'Feature {key} has no Target End date. PM should set the need-by
    date for planning purposes.

    '
  recipients:
  - product_manager
scope: team
verification: deterministic
enforcement: flag
sources:
- id: SOURCE-01
  excerpt: Feature in active status with no Target End date set
- id: SOURCE-14
  excerpt: 'Target End: PM''s ''no later than'' delivery date'
date_added: 2026-07-28
date_suppressed: 2026-09-17

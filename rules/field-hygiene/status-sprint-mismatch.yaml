id: status-sprint-mismatch
name: Status/Sprint Mismatch
status: suppressed
enabled: false
description: 'SUPPRESSED 2026-09-17. Engine policy: only rules with a documented process consequence (release exclusion, freeze gate, exception process, or mandatory field for that issue type/status) stay active. This rule fails that bar. Re-enable only if a source elevates it to a hard requirement.

Original intent: Active-status work should be in an active sprint.

'
applies_to:
- Story
- Task
- Bug
- Spike
condition:
  status:
  - In Progress
  - Review
  - Testing
  in_active_sprint: false
action:
  type: alert
  message: '{key} is {status} but not in any active sprint. Add to the current
    sprint or reset status to Backlog if work has paused.

    '
  recipients:
  - assignee
scope: org
verification: deterministic
enforcement: comment
sources:
- id: SOURCE-12
  excerpt: Health scoring penalizes in-progress issues without sprint assignment
date_added: 2026-07-28
date_suppressed: 2026-09-17

id: signoff-incomplete
name: Incomplete Sign-Off on Feature
status: suppressed
enabled: false
description: 'SUPPRESSED 2026-09-17. SOURCE-149 (Feb 2026) asked Delivery Owners to manually clone DP/TP/GA signoff templates. ADLC/strat-creator does not attach these templates; DP Features with Release Type never have the links. Manual clone hygiene is outdated relative to the AI Feature pipeline. Re-enable only if a current org process re-mandates template cloning (or ADLC automates it).

Original intent: All subtasks on the cloned signoff template must be Done before release-ready.

'
applies_to:
- Feature
condition:
  status:
  - In Progress
  - Review
  no_signoff_complete: true
action:
  type: alert
  message: '{key} has an incomplete sign-off template. One or more subtask
    sign-offs are not Done. Complete all sign-offs before marking the feature
    as release-ready.

    '
  recipients:
  - assignee
scope: org
verification: heuristic
enforcement: alert
sources:
- id: SOURCE-08
  excerpt: Sign-off process requires cloning the template and completing all
    subtask approvals
date_added: 2026-07-29
date_suppressed: 2026-09-17

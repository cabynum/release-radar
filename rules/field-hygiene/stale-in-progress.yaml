id: stale-in-progress
name: Stale In Progress
status: suppressed
enabled: false
description: 'SUPPRESSED 2026-09-17. Engine policy: only rules with a documented process consequence (release exclusion, freeze gate, exception process, or mandatory field for that issue type/status) stay active. This rule fails that bar. Re-enable only if a source elevates it to a hard requirement.

Original intent: Flag In Progress items with no updates for 21+ days.

'
applies_to:
- Story
- Task
- Bug
- Spike
- Epic
condition:
  status:
  - In Progress
  days_in_status: 21
  no_recent_update: true
action:
  type: alert
  message: '{key} has been In Progress for {days} days with no updates. Is
    this still active? Update status, add a comment, or move to Backlog.

    '
  recipients:
  - assignee
  - manager
scope: org
verification: deterministic
enforcement: comment
sources:
- id: SOURCE-01
  excerpt: Staleness thresholds for in-progress work
- id: SOURCE-12
  excerpt: Cadence scoring penalizes issues without recent updates
date_added: 2026-07-28
date_suppressed: 2026-09-17

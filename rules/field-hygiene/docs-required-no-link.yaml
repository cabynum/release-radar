id: docs-required-no-link
name: Docs Required but No Doc Link
status: suppressed
enabled: false
description: 'SUPPRESSED 2026-08-05. Continuous "must link a docs issue via
  documents / is documented by" is not backed by SOURCE-01 (that source only
  requires Docs Required = Yes/No). Re-enable only if a stronger source
  appears. Feature Freeze draft handoff remains covered by
  doc-draft-at-feature-freeze (SOURCE-102).

  Original intent: Features with Docs Required = Yes should have a linked
  documentation issue.

  '
applies_to:
- Feature
condition:
  field_value:
    field: docs_required
    value: 'Yes'
  no_doc_draft_linked: true
action:
  type: alert
  message: '{key} has Docs Required = Yes but no documentation issue linked.
    Link the doc issue via "documents" or "is documented by" before the feature
    ships.

    '
  recipients:
  - assignee
scope: org
verification: heuristic
enforcement: alert
sources:
- id: SOURCE-01
  excerpt: 'WEAK / MISATTRIBUTED: SOURCE-01 only requires Docs Required field
    Yes or No. It does not require a linked documentation issue.'
date_added: 2026-07-29
date_suppressed: 2026-08-05
